# OPTIONAL development overlay. Requires Docker Compose 2.22+.
# Run: docker compose -f docker-compose.yml -f docker-compose.watch.yml up --build --watch
# Does not change your existing port mappings or secrets in docker-compose.yml.
services:
  api:
    develop:
      watch:
        - action: sync+restart
          path: ./backend/app
          target: /app/app
        - action: rebuild
          path: ./backend/requirements.txt
  web:
    command: ["npm", "run", "dev", "--", "-H", "0.0.0.0"]
    develop:
      watch:
        - action: sync
          path: ./frontend/app
          target: /app/app
        - action: sync
          path: ./frontend/components
          target: /app/components
        - action: sync
          path: ./frontend/lib
          target: /app/lib
        - action: rebuild
          path: ./frontend/package.json
